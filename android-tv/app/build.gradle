plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ke.safitv.box'
    compileSdk 34

    defaultConfig {
        applicationId "ke.safitv.box"
        minSdk 21          // covers old Android TV boxes (Android 5+)
        targetSdk 34
        versionCode 14
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("SAFI_KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("SAFI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SAFI_KEY_ALIAS")
                keyPassword System.getenv("SAFI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            // R8 code shrinking/obfuscation. A signed release additionally
            // requires the four SAFI_* secrets above; never commit a keystore.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// AndroidX WebKit: lets us serve assets/www over a secure in-app https origin
// (needed for embedded live players) — it cannot open anything outside the app.
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
